name: CodeQL

on:
  push:
    branches:
      - main
      - phase-5-4-1-memory-attribution-and-resume
  pull_request:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: java-kotlin

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test deterministic release tree
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          output: target/codeql-results
          upload: "false"
          upload-database: "false"

      - name: Upload bounded CodeQL SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.sha }}
          path: target/codeql-results/**
          if-no-files-found: error
          retention-days: 7
