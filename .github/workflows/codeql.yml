name: CodeQL

on:
  push:
    branches:
      - main
      - phase-5-4-1-memory-attribution-and-resume
  pull_request:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: java-kotlin

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test deterministic release tree
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
