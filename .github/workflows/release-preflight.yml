name: Release preflight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  local-artifact-verification:
    name: Public artifact dry run
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify and install the local RC
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress -Ppublic-release clean install

      - name: Verify the external consumer
        shell: pwsh
        run: >-
          .\mvnw.cmd --batch-mode --no-transfer-progress
          -f release\consumer\pom.xml
          "-Dstackmate.version=0.1.0-rc.1" verify

      - name: Verify the frozen public API baseline
        shell: pwsh
        run: |
          .\release\generate-public-api.ps1 `
            -Version 0.1.0-rc.1 `
            -SignatureOutput target/release-api-current.txt `
            -InventoryOutput target/release-api-current.json
          $expected = (Get-Content release/public-api-inventory.json -Raw | ConvertFrom-Json).signatureSha256
          $actual = (Get-FileHash target/release-api-current.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Public API signature drift: $actual" }

      - name: Assemble and audit the local bundle
        shell: pwsh
        run: .\release\assemble-local-rc.ps1 -Version 0.1.0-rc.1
