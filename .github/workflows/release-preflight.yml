name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STACKMATE_VERSION: 0.1.0-rc.2

jobs:
  local-artifact-verification:
    name: Public artifact dry run
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Verify and install the local RC
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress -Ppublic-release clean install

      - name: Verify the external consumer
        shell: pwsh
        run: >-
          .\mvnw.cmd --batch-mode --no-transfer-progress
          -f release\consumer\pom.xml
          "-Dstackmate.version=$env:STACKMATE_VERSION" clean verify

      - name: Verify the frozen public API baseline
        shell: pwsh
        run: |
          .\release\generate-public-api.ps1 `
            -Version $env:STACKMATE_VERSION `
            -SignatureOutput target/qualification/public-api.txt `
            -InventoryOutput target/qualification/public-api.json
          $expected = (Get-Content release/public-api-inventory.json -Raw | ConvertFrom-Json).signatureSha256
          $actual = (Get-FileHash target/qualification/public-api.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Public API signature drift: $actual" }

      - name: Assemble and audit the local bundle
        shell: pwsh
        run: >-
          .\release\assemble-local-rc.ps1
          -Version $env:STACKMATE_VERSION
          -OutputRoot target/qualification-release

      - name: Collect qualification evidence
        shell: pwsh
        run: >-
          .\release\collect-qualification-evidence.ps1
          -Platform Windows-release-preflight
          -Version $env:STACKMATE_VERSION
          -BundlePath "target/qualification-release/stackmate-$env:STACKMATE_VERSION"

      - name: Verify local file-repository deployment
        shell: pwsh
        run: >-
          .\release\verify-file-repository.ps1
          -Version $env:STACKMATE_VERSION

      - name: Upload bounded release-preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preflight-Windows-${{ github.sha }}
          path: |
            target/qualification/**
            target/qualification-release/**
            target/file-repository-verification/**/file-repository-report.json
          if-no-files-found: error
          retention-days: 7
